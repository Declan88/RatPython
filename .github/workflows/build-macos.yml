name: Build macOS

# Nuitka compiles for the machine it runs on, so the Mac build has to run on a Mac: GitHub's.
# Start it from the Actions tab ("Run workflow") or by pushing a tag like v1.2.3.
# The result is a zipped RatWar.app, attached to the run as an artifact.
# BuildCMD_Nuitka_Standalone_Packed.cmd starts this itself and uploads the result to Steam (tools/mac_build.py).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Game version to build as (e.g. 0.1.5) - blank keeps Modules/version.py's"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14            # Apple Silicon (arm64)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The build command bumps the version just before starting this run, without pushing it - so it's
      # passed in here, and the Mac build carries the same version as the Windows one (lobbies only let
      # players on the same version join each other).
      - name: Set the game version
        if: ${{ github.event.inputs.version != '' }}
        env:
          GAME_VERSION: ${{ github.event.inputs.version }}
        run: python tools/bump_version.py --set "$GAME_VERSION"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: py_steam_net-main

      # The versions the project is developed against.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin Nuitka==4.2.1 \
            moderngl==5.12.0 numpy==2.5.2 OpenEXR==3.4.15 pillow==12.3.0 pygame-ce==2.5.8 \
            pyglm==2.8.3 pygltflib==1.16.5 trimesh==5.1.0 Panda3D==1.10.16

      # The repo only holds Windows wheels of py_steam_net, so build the macOS one from source.
      - name: Build py_steam_net (Steam wrapper)
        run: |
          maturin build --release --interpreter python \
            --manifest-path py_steam_net-main/Cargo.toml --out wheelhouse
          python -m pip install wheelhouse/*.whl
          # The wrapper's compiled library looks for libsteam_api.dylib right beside itself
          # (@loader_path), and the wheel doesn't carry it. It must be the copy the steamworks
          # crate was built against (its interface versions are checked at load time): the
          # repo-root libsteam_api.dylib is a newer SDK and lacks symbols the wrapper needs.
          # So use the crate's own, both beside the wrapper and as the root file that app.py
          # preloads and Nuitka bundles (this copy is only in the CI workspace, not committed).
          CRATE_DYLIB=$(find ~/.cargo/registry/src -path '*steamworks-sys-0.11.0/lib/steam/redistributable_bin/osx/libsteam_api.dylib' | head -n 1)
          test -n "$CRATE_DYLIB" || { echo "steamworks-sys dylib not found"; exit 1; }
          PKG=$(python -c "import importlib.util, os; print(os.path.dirname(importlib.util.find_spec('py_steam_net').origin))")
          cp "$CRATE_DYLIB" "$PKG/libsteam_api.dylib"
          cp "$CRATE_DYLIB" libsteam_api.dylib

      # Fail here, in seconds, if a dependency has no macOS wheel or won't import.
      - name: Check imports
        run: |
          python -c "import pygame, moderngl, glm, numpy, trimesh, pygltflib, OpenEXR, PIL, py_steam_net; \
          from panda3d.bullet import BulletWorld; print('imports ok')"

      # The build command wants Assets/icon/icon.icns; make it from icon.png (1024x1024).
      - name: Make icon.icns
        run: |
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s Assets/icon/icon.png --out icon.iconset/icon_${s}x${s}.png
            sips -z $((s * 2)) $((s * 2)) Assets/icon/icon.png --out icon.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns icon.iconset -o Assets/icon/icon.icns

      # Packed assets, like BuildCMD_Nuitka_Standalone_Packed.cmd: every asset becomes its own
      # encrypted blob, so a Steam update only re-sends the assets that changed.
      #
      # The encryption key is NOT in the repo (asset_key.bin is git-ignored). A different key
      # re-encrypts everything, so every player would redownload the whole game - it must be the
      # same key as the Windows builds. Store it once as the repository secret ASSET_KEY_B64:
      #   base64 -w0 asset_key.bin | gh secret set ASSET_KEY_B64 --repo Declan88/RatPython
      - name: Pack the assets
        env:
          ASSET_KEY_B64: ${{ secrets.ASSET_KEY_B64 }}
        run: |
          if [ -z "$ASSET_KEY_B64" ]; then
            echo "::error::Repository secret ASSET_KEY_B64 is not set (the base64 of asset_key.bin) - see the comment above this step."
            exit 1
          fi
          printf '%s' "$ASSET_KEY_B64" | base64 --decode > asset_key.bin
          test "$(wc -c < asset_key.bin | tr -d ' ')" = 32 || { echo "::error::asset_key.bin must be 32 bytes"; exit 1; }
          # Also writes Modules/Assets/_asset_key.py, which the compile below needs.
          python tools/pack_assets.py --out build_nuitka/packed --verify

      # Standalone, with NO --include-data-dir=Assets (plain assets must not ship). The scipy and
      # PIL-AVIF exclusions are the same size trims the Windows packed build uses. libsteam_api.dylib is
      # not listed: Nuitka bundles it as a dependency of py_steam_net (bundling it twice is an error).
      - name: Build with Nuitka
        run: |
          python -m nuitka --standalone --macos-create-app-bundle --macos-app-name="RatWar" \
            --macos-app-icon="Assets/icon/icon.icns" --assume-yes-for-downloads --disable-cache=ccache \
            --nofollow-import-to=Frontend --nofollow-import-to=scipy \
            --nofollow-import-to=PIL.AvifImagePlugin --nofollow-import-to=PIL._avif \
            --output-filename=RatWar --output-dir=build_nuitka_macos app.py

      # The game changes into the folder its executable sits in (app.py's _chdir_for_frozen_build),
      # so the packed Assets go beside the executable inside the bundle.
      - name: Add the packed assets
        run: |
          APP=$(find build_nuitka_macos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP" || { echo "::error::no .app in build_nuitka_macos"; ls -la build_nuitka_macos; exit 1; }
          # Nuitka names the bundle after the script (app.app); Steam's macOS launch option is RatWar.app.
          if [ "$(basename "$APP")" != "RatWar.app" ]; then
            mv "$APP" build_nuitka_macos/RatWar.app
            APP=build_nuitka_macos/RatWar.app
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          ls "$APP/Contents/MacOS" | head -20
          mkdir -p "$APP/Contents/MacOS/Assets"
          rsync -a --delete build_nuitka/packed/Assets/ "$APP/Contents/MacOS/Assets/"
          # Adding files invalidates the signature Nuitka gave the bundle (ad hoc); apple silicon
          # refuses unsigned code, so sign it again.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Check the packed build
        run: python tools/check_packed_build.py "$APP/Contents/MacOS" RatWar

      - name: Zip the app
        run: ditto -c -k --keepParent "$APP" RatWar-macOS-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RatWar-macOS-arm64
          path: RatWar-macOS-arm64.zip
          if-no-files-found: error
